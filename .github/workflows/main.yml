```yaml
name: Restful-Booker CI Pipeline

on: [push, pull_request]

jobs:
  api-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cai dat Newman
        run: npm install -g newman

      - name: Chay bo test tu dong
        run: newman run RestfulBooker.postman_collection.json -e RestfulBooker.postman_environment.json
```
